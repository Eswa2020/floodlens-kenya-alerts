# Names of secrets, never their values. Values live in .env locally
# (gitignored) or a secret manager (Key Vault / KMS) in a real deployment.
secrets:
  - name: OPENAI_API_KEY
    used_by: services/reports/rag.py (live mode only)
    required_in_stub_mode: false
  - name: FLOODLENS_API_KEYS
    used_by: services/reports/auth.py
    format: "key:role:user,key:role:user"
    required_in_stub_mode: false   # teaching keys demo-reporter / demo-officer work in stub mode only
    required_in_live_mode: true    # live mode with no keys refuses every request (fail closed)
